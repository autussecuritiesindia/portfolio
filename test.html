<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AUTUS Portfolio">
    <title>AUTUS Portfolio Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* BASE THEME - Light */
        :root {
            --bg: #EEF2F7; --surface: #FFFFFF; --surface2: #F8FAFC; --surface3: #F1F5F9;
            --border: #E2E8F0; --border2: #CBD5E1; --text: #1E293B; --text2: #475569; --muted: #94A3B8;
            --green: #0F7A4B; --green-bg: #ECFDF5; --green-border: #A7F3D0;
            --red: #C0392B; --red-bg: #FEF2F2; --red-border: #FECACA;
            --blue: #1D4ED8; --blue-bg: #EFF6FF; --blue-border: #BFDBFE;
            --gold: #92400E; --gold-bg: #FFFBEB; --gold-border: #FDE68A;
            --indigo: #4F46E5; --indigo-bg: #EEF2FF;
            --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
            --shadow2: 0 4px 16px rgba(0,0,0,.1); --shadow3: 0 0 3px rgba(29,78,216,.12);
            --r1: 10px; --r2: 8px; --mono: 'JetBrains Mono', monospace; --sans: Inter, sans-serif;
        }
        /* DARK THEME */
        [data-theme="dark"] { --bg: #0D1117; --surface: #161B26; --surface2: #1C2233; --surface3: #212840;
            --border: #2A3248; --border2: #364069; --text: #E2E8F0; --text2: #94A3B8; --muted: #4A5568;
            --green: #22C55E; --green-bg: rgba(34,197,94,.1); --green-border: rgba(34,197,94,.25);
            --red: #F87171
